services:
  db:
    build:
      context: ./db
    environment:
      POSTGRES_DB: parser
      POSTGRES_USER: parser
      POSTGRES_PASSWORD: parser
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parser -d parser"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://parser:parser@db:5432/parser
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: parser
      PGUSER: parser
      PGPASSWORD: parser
    volumes:
      - ./app:/app
      - app-vendor:/app/vendor
    working_dir: /app

volumes:
  pgdata:
  app-vendor:
